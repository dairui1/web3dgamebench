[calibration]
season = "season-1"
profile = "pi-deepseek-v4-flash"
tasks = ["canyon-strike", "bombsite-retake", "first-night"]
backend = "harbor"

# The candidate prompts and admission surface changed together. Calibration
# therefore requires every current admission check rather than comparing raw
# check counts with runs produced from the earlier detailed prompts.
[calibration.baselines.canyon-strike]
kind = "conservative-full-admission"
reference = "prompt-and-admission-reset"

[calibration.baselines.bombsite-retake]
kind = "conservative-full-admission"
reference = "prompt-and-admission-reset"

[calibration.baselines.first-night]
kind = "conservative-full-admission"
reference = "prompt-and-admission-reset"
