[container]
image = "web3dgamebench-candidate:0.3.0"
evaluator_image = "web3dgamebench-evaluator:0.1.0"
internal_network = "web3dgamebench-internal"
egress_network = "web3dgamebench-egress"
proxy_container = "web3dgamebench-egress-proxy"
proxy_port = 8888
memory = "8g"
cpus = "6"
command_timeout_seconds = 5400
candidate_total_timeout_seconds = 5400
pids_limit = 1024

# Model APIs only. Do not add galleries, GitHub, npm, CDNs, or the public site.
egress_allow = [
  "chatgpt.com",
  "openai.com",
  "oaiusercontent.com",
  "anthropic.com",
  "opencode.ai",
]

[container.pi_adapter]
version = "web3dgamebench-pi-goal-bridge-v1"
upstream_pi_goal_version = "0.54.4"
runtime_evidence_schema_version = 4
