[container]
image = "web3dgamebench-candidate:0.1.0"
evaluator_image = "web3dgamebench-evaluator:0.1.0"
internal_network = "web3dgamebench-internal"
egress_network = "web3dgamebench-egress"
proxy_container = "web3dgamebench-egress-proxy"
proxy_port = 8888
memory = "8g"
cpus = "6"

# Model APIs only. Do not add galleries, GitHub, npm, CDNs, or the public site.
egress_allow = [
  "chatgpt.com",
  "openai.com",
  "oaiusercontent.com",
  "anthropic.com",
  "opencode.ai",
]
