[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web3dgamebench"
version = "0.1.0"
description = "Reproducible Three.js game benchmark and blind preference arena"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
web3dgamebench = "web3dgamebench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web3dgamebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 92
target-version = "py311"
